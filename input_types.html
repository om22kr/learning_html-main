<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Input Types type in HTML</title>
</head>
<body>

    <header>
        <h1>About Us</h1>
        <nav>
        
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="products.html">Products</a> |
            <a href="services.html">Services</a> |
            <a href="contact.html">Contact</a> |
            <a href="audio_video.html">Audio/Video</a> |
            <a href="form.html">Form</a> | 
            <a href="login.html">Login</a> 

        </nav>
    </header>
    
    <form>
        <label>First Name</label>
        <input type="text" placeholder="Enter your name" />
        <br><br>
        <label>Last Name</label>
        <input type="text" placeholder="Enter your last name" />
        <br><br>
        <label>Enter Email</label>
        <input type="email" placeholder="Enter your email" />
        <br><br>
        <label>Enter Fax Number</label>
        <input type="number" placeholder="Enter your fax number" />

        <br><br>
        <label>Select DOB</label>
        <input type="date" />
        <label>Select MONTH</label>
        <input type="month" />
        <label>Select Week</label>
        <input type="week" />
        <br><br>
        <label>Select Time</label>
        <input type="time" />
        <label>Select Date and Time</label>
        <input type="datetime-local" />

        <br><br>
        <label>Choose City</label>
        <input type="checkbox" checked> Mumbai
        <input type="checkbox"> Pune
        <input type="checkbox"> Delhi
        <input type="checkbox"> Chennai
        <br><br>
        <label>Select Gender</label>
        <input type="radio" name="gender" /> Male
        <input type="radio" name="gender" /> Female
        <input type="radio" name="gender" /> Others
        <br><br>

        <label>Select Color</label>
        <input type="color" />

        <label>Select Range</label>
        <input type="range" />

        <label>Upload DOcs</label>
        <input type="file" multiple />

        <br><br>
        <label>Enter Password</label>
        <input type="password" placeholder="Enter your password" />

        <label>Search</label>
        <input type="search" placeholder="Search..." />

        <br><br>
        <label>Enter URL</label>
        <input type="url" placeholder="Enter your URL" />

        <label>Enter Phone Number</label>
        <input type="tel" placeholder="Enter your phone number" />
        <br><br>

        <label>Select Country</label>
        <select>
            <option value="india">India</option>
            <option value="china">China</option>
            <option value="japan">Japan</option>
            <option value="usa">USA</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
        </select>
        <br><br>

        <label>Enter Address</label><br>
        <textarea rows="4" cols="50"></textarea>
        <br><br>
        <input type="submit" value="Submit" />
        <input type="reset" value="Reset" />
        <input type="button" value="Click Me" />
        <br><br> <br><br> <br><br>
        
    </form>

</body>
</html>
